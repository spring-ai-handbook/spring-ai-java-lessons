spring:
  application:
    name: spring-ai-java-lessons

  ai:
    model:
      # 主聊天模型：DeepSeek。
      chat: deepseek
      # Embedding 继续通过 OpenAI-compatible 接口实现。
      embedding: openai
      # 可选能力默认关闭，避免没有对应 API Key 时出现 Bean 创建失败。
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-chat}

    openai:
      embedding:
        # 允许继续使用 OpenAI-compatible Embedding 服务。
        base-url: ${OPENAI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${OPENAI_EMBEDDING_API_KEY}
        model: ${OPENAI_EMBEDDING_MODEL:qwen3.7-text-embedding}
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1024}
        encoding-format: float

# Lesson21：仅暴露学习所需 Actuator 端点。
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    com.example.springai: INFO
